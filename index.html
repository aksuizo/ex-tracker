<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c7b">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spend">
<title>Spend</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#10243a;--mute:#6b7c8f;--line:#dbe3ec;--acc:#0e7c7b;--accink:#fff;--warn:#d98e04;--bad:#c8412b;--ok:#0e7c7b}
@media(prefers-color-scheme:dark){:root{--bg:#0c1722;--card:#14232f;--ink:#e8eef4;--mute:#8a9bad;--line:#243645;--acc:#2bb5b3;--accink:#06201f;--warn:#f0b23a;--bad:#ef6b55;--ok:#2bb5b3}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px)}
main{max-width:520px;margin:0 auto;padding:14px 14px calc(84px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:22px 0 8px;color:var(--mute);font-weight:600}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.who{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input.amt{font-size:38px;font-weight:700;border:0;background:none;padding:0;font-variant-numeric:tabular-nums}
.cur{color:var(--mute);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:7px 12px;font:inherit;font-size:14px}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
button.go{width:100%;margin-top:16px;border:0;border-radius:12px;background:var(--acc);color:var(--accink);font:inherit;font-weight:700;padding:14px}
button.sm{border:0;background:none;color:var(--mute);font:inherit;font-size:14px;padding:4px 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.row small{color:var(--mute);display:block}.r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--ok)}
.big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}.mute{color:var(--mute);font-size:14px}
.tag{font-size:12px;border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:1px 6px;margin-left:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:13px;padding:12px 0}
nav button.on{color:var(--acc);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table.t{width:100%;border-collapse:collapse;font-size:14px}.t th{text-align:left;color:var(--mute);font-weight:600;font-size:12px;padding:6px 8px}.t td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}.t .r{text-align:right}.t small{color:var(--mute)}
.dh{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-weight:600;padding:12px 0 4px;border-top:1px solid var(--line)}.dh:first-child{border-top:0;padding-top:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr;column-gap:14px}
.vw,nav button .l{display:none}
.v-add,.v-rec,.v-set,.v-who{max-width:560px}.v-month{max-width:640px}
@media(min-width:700px){
  main{max-width:780px;padding-top:20px}
  .grid{grid-template-columns:1fr 1fr}.fg{grid-template-columns:repeat(4,1fr)}
  .vm{display:none}.vw{display:block}
  nav button .s{display:none}nav button .l{display:inline}
}
@media(min-width:1000px){
  body{padding-left:210px}
  main{max-width:1000px;padding:28px 32px 40px}
  nav{top:0;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:24px 12px;gap:4px}
  nav button{flex:none;text-align:left;padding:12px 14px;border-radius:10px;font-size:15px}
  nav button.on{background:var(--bg)}
  .toast{bottom:28px;left:calc(50% + 105px)}
}
input[type=date],input[type=month]{min-height:44px;-webkit-appearance:none;appearance:none}
.mp{display:flex;gap:8px;align-items:center;margin-bottom:12px}.mp input{flex:1;text-align:center}.mp .chip{min-width:44px;min-height:44px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fg3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:14px;padding:12px 14px}
.kpi small{display:block;color:var(--mute);font-size:12px}.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px}.kpi i{font-style:normal;font-size:12px;color:var(--mute)}
.neg{color:var(--bad)}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main>
<header><h1 id="ttl">Spend</h1><button class="who" id="who"></button></header>
<div id="v"></div>
</main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const DEF={user:'',url:'',budget:0,cats:['Groceries','Food Delivery','Fuel','DEWA','Telecom','Internet','Other'],srcs:['Aaron Salary','Faith Salary','Aaron CC','Faith CC','Others'],exp:[],rec:[],q:[],tab:'add',src:'',cat:'',dash:'cat',scope:'all',cash:0,cb:{},users:[],loaded:false};
let S=Object.assign({},DEF,JSON.parse(localStorage.getItem('spend')||'{}'));
const save=()=>localStorage.setItem('spend',JSON.stringify(S));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const aed=n=>'AED '+Math.round(n*100/100).toLocaleString('en-US',{maximumFractionDigits:2});
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)};
const sum=a=>a.reduce((x,e)=>x+e.amount,0);
const cfg=()=>({rec:S.rec,budget:S.budget,cats:S.cats,srcs:S.srcs,cb:S.cb,cash:S.cash,users:S.users});
const mo=()=>today().slice(0,7);
let DM=null;const dm=()=>DM||mo();
const shift=(m,n)=>{const d=new Date(+m.slice(0,4),+m.slice(5)-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const members=()=>[...new Set([...S.users,...S.exp.map(e=>e.user)])].filter(u=>u&&u!=='Recurring');
const choose=u=>{S.user=u;if(!S.users.includes(u)){S.users.push(u);queue({a:'cfg',cfg:cfg()})}S.tab='dash';save();render()};
const queue=op=>{if(op.a==='cfg'&&S.url&&!S.loaded){toast('Still loading shared settings. Try again in a moment.');return}
  if(op.a==='cfg')S.q=S.q.filter(o=>o.a!=='cfg');S.q.push(op);save();flush()};

/* ---------- sync ---------- */
let busy=false;
const webpage='The link returned a web page, not data. In Apps Script set access to Anyone, then redeploy as a New version.';
async function send(op){
  const init={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(op)};
  try{
    const r=await fetch(S.url,init),t=(await r.text()).trim();
    if(!r.ok)throw new Error('HTTP '+r.status);
    if(t!=='ok')throw new Error(t.includes('<')?webpage:t.slice(0,150));
    return;
  }catch(e){if(!(e instanceof TypeError))throw e}
  await fetch(S.url,{...init,mode:'no-cors'});
  const j=JSON.parse(await (await fetch(S.url)).text());
  if(op.a==='add'&&!j.exp.some(x=>x.id===op.e.id))throw new Error('The sheet did not receive the entry');
}
async function flush(){
  if(!S.url||busy||!navigator.onLine)return;busy=true;
  try{while(S.q.length){await send(S.q[0]);S.q.shift();S.err='';save()}}
  catch(e){S.err='Could not send to the sheet: '+(e.message||e)}
  save();busy=false;
}
const canon=(v,list,d)=>{v=String(v==null?'':v).trim();if(!v)return d;return list.find(x=>x.toLowerCase()===v.toLowerCase())||v};
const fix=e=>{
  let a=e.amount;if(typeof a!=='number')a=parseFloat(String(a).replace(/[^0-9.\-]/g,''));
  let d=String(e.date||'').trim(),m;
  if(m=d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))d=m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  else if(m=d.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/))d=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return {...e,amount:isNaN(a)?0:a,date:d,cat:canon(e.cat,S.cats,'Uncategorized'),src:canon(e.src,S.srcs,'Unassigned'),user:canon(e.user,S.users.concat('Recurring'),'Unknown')};
};
async function pull(){
  if(!S.url||!navigator.onLine)return;
  await flush();if(S.q.length)return;
  try{
    const x=await (await fetch(S.url)).text();let j;
    try{j=JSON.parse(x)}catch(e){throw new Error(x.includes('<')?webpage:'Unreadable reply')}
    if(j.error)throw new Error(j.error);
    const remote=j.exp.map(e=>({...e,amount:+e.amount,planned:!!e.planned}));
    if(!S.loaded){const ids=new Set(remote.map(e=>e.id));S.exp.forEach(e=>{if(!ids.has(e.id)){remote.push(e);S.q.push({a:'add',e})}})}
    S.exp=remote;S.loaded=true;S.err='';
    if(j.cfg&&j.cfg.rec){S.rec=j.cfg.rec;S.budget=j.cfg.budget||0;if(j.cfg.cb)S.cb=j.cfg.cb;if(j.cfg.cash!=null)S.cash=+j.cfg.cash||0;if(j.cfg.users)S.users=j.cfg.users;if(j.cfg.cats&&j.cfg.cats.length)S.cats=j.cfg.cats;if(j.cfg.srcs&&j.cfg.srcs.length)S.srcs=j.cfg.srcs}
    S.exp=S.exp.map(fix);save();
  }catch(e){S.err='Could not read the sheet: '+(e.message||e);save()}
}
function autopost(){
  const d=today(),m=d.slice(0,7),day=+d.slice(8);
  S.rec.forEach(r=>{
    const id='r-'+r.id+'-'+m;
    if(day>=r.day&&!S.exp.some(e=>e.id===id)){
      const e={id,date:m+'-'+String(r.day).padStart(2,'0'),user:'Recurring',item:r.name,amount:r.amount,src:r.src,cat:r.cat,planned:false};
      S.exp.push(e);queue({a:'add',e});
    }
  });save();
}
async function sync(quiet){await pull();autopost();await flush();if(!quiet||S.tab==='month'||S.tab==='dash'||(S.tab==='tx'&&!['INPUT','SELECT'].includes((document.activeElement||{}).tagName)))render()}

/* ---------- views ---------- */
const chips=(list,sel,k)=>'<div class="chips">'+list.map(x=>`<button type="button" class="chip${x===sel?' on':''}" data-k="${k}" data-v="${esc(x)}">${esc(x)}</button>`).join('')+'</div>';
function render(){
  $('#who').textContent=S.user||'Who are you?';
  const T=[['dash','Home','Home'],['add','Add','Add'],['month','Month','Month'],['tx','Txns','Transactions'],['rec','Fixed','Recurring'],['set','Settings','Settings']];
  $('#nav').innerHTML=T.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-t="${t[0]}"><span class="s">${t[1]}</span><span class="l">${t[2]}</span></button>`).join('');
  $('#ttl').textContent={tx:'Transactions',who:'Who is this?',dash:new Date(+dm().slice(0,4),+dm().slice(5)-1,1).toLocaleString('en',{month:'long',year:'numeric'}),add:'Add spend',month:new Date().toLocaleString('en',{month:'long'}),rec:'Monthly fixed',set:'Settings'}[S.tab];
  $('#v').className='v-'+S.tab;$('#v').innerHTML=views[S.tab]();
}
const COL=['#0e7c7b','#e09f1f','#c8412b','#3b6fb6','#7a5aa6','#6aa84f','#d4688f','#8a9bad'];
function donut(items,tot){let off=25;
  return '<svg viewBox="0 0 42 42" width="190" height="190" style="color:var(--ink)"><circle cx="21" cy="21" r="15.9155" fill="none" style="stroke:var(--line)" stroke-width="6"/>'
  +items.map((x,i)=>{const p=x[1]/tot*100,c=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${COL[i%COL.length]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p;return c}).join('')
  +`<text x="21" y="21.8" text-anchor="middle" font-size="4" font-weight="700" fill="currentColor">${Math.round(tot).toLocaleString('en-US')}</text><text x="21" y="26" text-anchor="middle" font-size="2.4" style="fill:var(--mute)">AED spent</text></svg>`}
const nice=m=>{const u=Math.pow(10,Math.floor(Math.log10(m)))/2;return Math.ceil(m/u)*u};
const tk=v=>v>=1000?+(v/1000).toFixed(1)+'k':Math.round(v);
function bars(labels,series,style){
  const W=360,H=240,L=36,R=6,T=10,B=58,max=nice(Math.max(1,...series.flat())),ih=H-T-B,g=(W-L-R)/labels.length,bw=Math.min(20,g*.8/series.length);
  let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
  for(let k=0;k<=4;k++){const y=T+ih-ih*k/4;o+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${L-4}" y="${y+3}" text-anchor="end" font-size="9" style="fill:var(--mute)">${tk(max*k/4)}</text>`}
  labels.forEach((lb,i)=>{
    const x0=L+i*g+(g-bw*series.length)/2;
    series.forEach((s,si)=>{const h=ih*s[i]/max;if(h>0)o+=`<rect x="${x0+si*bw}" y="${T+ih-h}" width="${bw-1}" height="${h}" rx="2" style="${style(si,i)}"/>`});
    const cx=L+i*g+g/2,y=T+ih+12;
    o+=`<text x="${cx}" y="${y}" text-anchor="end" font-size="9" transform="rotate(-40 ${cx} ${y})" style="fill:var(--mute)">${esc(lb.length>11?lb.slice(0,10)+'…':lb)}</text>`});
  return o+'</svg>'}
const leg=a=>'<div class="chips" style="margin-top:4px;gap:12px">'+a.map(x=>`<span class="mute" style="display:flex;align-items:center;gap:5px"><i style="width:10px;height:10px;border-radius:2px;background:${x[0]}"></i>${esc(x[1])}</span>`).join('')+'</div>';
const F={q:'',f:'',t:'',u:'all',c:'all',s:'all'};
function txList(){
  const q=F.q.toLowerCase();
  const L=S.exp.filter(e=>(!F.f||e.date>=F.f)&&(!F.t||e.date<=F.t)&&(F.u==='all'||e.user===F.u)&&(F.c==='all'||e.cat===F.c)&&(F.s==='all'||e.src===F.s)&&(!q||(e.item+' '+e.cat+' '+e.src+' '+e.user).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
  if(!L.length)return '<div class="card mute">No transactions match.</div>';
  const tot=sum(L.filter(e=>!e.planned)),sh=L.slice(0,300),yr=today().slice(0,4);
  const act=e=>(e.planned?`<button class="sm" data-paid="${e.id}">Mark paid</button>`:'')+`<button class="sm" data-del="${e.id}">Delete</button>`;
  const tag=e=>e.planned?'<span class="tag">upcoming</span>':'';
  const dl=d=>new Date(d+'T00:00:00').toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short',year:d.slice(0,4)===yr?undefined:'numeric'});
  let h='',last='';
  sh.forEach(e=>{
    if(e.date!==last){last=e.date;h+=`<div class="dh"><span>${dl(e.date)}</span><span>${aed(sum(sh.filter(x=>x.date===e.date&&!x.planned)))}</span></div>`}
    h+=`<div class="row"><div>${esc(e.item||e.cat)}${tag(e)}<small>${esc(e.user)} · ${esc(e.src)} · ${esc(e.cat)}</small></div><div class="r">${aed(e.amount)}<br>${act(e)}</div></div>`});
  const t=sh.map(e=>`<tr><td>${e.date}</td><td>${esc(e.item||'-')}${tag(e)}</td><td>${esc(e.user)}</td><td>${esc(e.src)}</td><td>${esc(e.cat)}</td><td class="r">${aed(e.amount)}</td><td>${act(e)}</td></tr>`).join('');
  return `<div class="mute" style="margin:4px 0 8px">${L.length} transaction${L.length>1?'s':''} · ${aed(tot)} spent${L.length>300?' · showing latest 300':''}</div>
<div class="card vm">${h}</div>
<div class="card vw"><table class="t"><thead><tr><th>Date</th><th>Item</th><th>Person</th><th>Fund source</th><th>Category</th><th class="r">Amount</th><th></th></tr></thead><tbody>${t}</tbody></table></div>`}
const views={
tx(){
  const ms=[...new Set(S.exp.map(e=>e.date.slice(0,7)))].sort().reverse();
  const ml=m=>new Date(m+'-01T00:00:00').toLocaleString('en',{month:'short',year:'numeric'});
  const sel=(id,cur,o)=>`<select id="${id}">${o.map(x=>`<option value="${esc(x[0])}"${x[0]===cur?' selected':''}>${esc(x[1])}</option>`).join('')}</select>`;
  return `<input id="fq" placeholder="Search item, category, person…" value="${esc(F.q)}" style="margin-bottom:8px">
<div class="fg2"><div><label style="margin:0 0 4px">From</label><input type="date" id="ff" value="${F.f}"></div><div><label style="margin:0 0 4px">To</label><input type="date" id="ft" value="${F.t}"></div></div>
<div class="fg3">${sel('fu',F.u,[['all','Everyone'],...members().map(u=>[u,u]),['Recurring','Recurring']])}${sel('fc',F.c,[['all','All categories'],...S.cats.map(c=>[c,c])])}${sel('fs',F.s,[['all','All sources'],...S.srcs.map(c=>[c,c])])}</div>
<div style="margin:0 0 8px"><button class="sm" data-reset="1" style="padding-left:0">Reset filters</button></div>
<div id="txl">${txList()}</div>`},
who(){return `<div class="card"><label style="margin-top:0">Tap your name</label><div class="chips">${members().map(u=>`<button class="chip${u===S.user?' on':''}" data-who="${esc(u)}">${esc(u)}</button>`).join('')||'<span class="mute">No one yet</span>'}</div>
<label>Not listed? Add yourself</label><input id="wn" placeholder="Your name"><button class="go" id="wadd">Join</button></div>`},
dash(){
  let L=S.exp.filter(e=>e.date.startsWith(dm())&&!e.planned);
  if(S.scope==='mine')L=L.filter(e=>e.user===S.user);
  const o={};L.forEach(e=>o[e[S.dash]]=(o[e[S.dash]]||0)+e.amount);
  const items=Object.entries(o).sort((a,b)=>b[1]-a[1]),tot=sum(L);
  const all=S.exp.filter(e=>!e.planned),cm=all.filter(e=>e.date.startsWith(dm()));
  const cl=[...new Set([...S.cats,...cm.map(e=>e.cat)])],sp=cl.map(c=>sum(cm.filter(e=>e.cat===c))),bd=cl.map(c=>+S.cb[c]||0);
  const c1=bars(cl,[bd,sp],(si,i)=>si===0?'fill:var(--mute);opacity:.45':'fill:'+(bd[i]&&sp[i]>bd[i]?'var(--bad)':'var(--acc)'));
  const brow=cl.map((c,i)=>bd[i]?`<div class="row"><span>${esc(c)}</span><span class="r" style="color:${sp[i]>bd[i]?'var(--bad)':'inherit'}">${aed(sp[i])} / ${aed(bd[i])}<small style="font-weight:400;color:${sp[i]>bd[i]?'var(--bad)':'var(--mute)'}">${sp[i]>bd[i]?'over by '+aed(sp[i]-bd[i]):aed(bd[i]-sp[i])+' left'}</small></span></div>`:'').join('');
  const ms=[];for(let k=5;k>=0;k--){const d=new Date(+dm().slice(0,4),+dm().slice(5)-1-k,1);ms.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
  const ml=ms.map(x=>new Date(x+'-01').toLocaleString('en',{month:'short',timeZone:'UTC'}));
  const us=[...new Set(all.filter(e=>e.user!=='Recurring').map(e=>e.user))];
  const c2=us.length?bars(ml,us.map(u=>ms.map(x=>sum(all.filter(e=>e.user===u&&e.date.startsWith(x))))),si=>'fill:'+COL[si%COL.length])+leg(us.map((u,i)=>[COL[i%COL.length],u])):'<div class="mute" style="padding:20px 0">No entries yet</div>';
  const so={},sc={};cm.forEach(e=>{so[e.src]=(so[e.src]||0)+e.amount;sc[e.src]=(sc[e.src]||0)+1});
  const sl=Object.entries(so).sort((a,b)=>b[1]-a[1]);
  const c3=sl.map((x,i)=>`<div style="margin:12px 0"><div class="row" style="border:0;padding:0"><span>${esc(x[0])}${i===0?'<span class="tag" style="border-color:var(--acc);color:var(--acc)">most used</span>':''}</span><span class="r">${aed(x[1])} <small style="display:inline;font-weight:400">${sc[x[0]]} entries</small></span></div><div class="bar" style="height:8px;margin:5px 0 0"><i style="width:${x[1]/sl[0][1]*100}%;background:${COL[i%COL.length]}"></i></div></div>`).join('')||'<div class="mute" style="padding:20px 0">No spending yet this month</div>';
  const dnow=+today().slice(8),planM=S.exp.filter(e=>e.planned&&e.date.startsWith(dm()));
  const pendR=S.rec.filter(r=>!S.exp.some(e=>e.id==='r-'+r.id+'-'+dm())&&(dm()>mo()||(dm()===mo()&&r.day>dnow)));
  const kSpent=sum(cm),kUp=sum(planM)+sum(pendR),kBal=S.cash-kSpent,kSav=kBal-kUp;
  const kpi=(t,v,sub,col,neg)=>`<div class="kpi" style="border-top-color:${col}"><small>${t}</small><b class="${neg&&v<0?'neg':''}">${aed(v)}</b><i>${sub}</i></div>`;
  const kpis=`<div class="kpis">${kpi('Current balance',kBal,S.cash?'of '+aed(S.cash)+' cash on hand':'Set cash on hand in Settings','var(--acc)',1)}${kpi('Total spent',kSpent,S.budget?Math.round(kSpent/S.budget*100)+'% of budget':'this month','var(--warn)')}${kpi('Total upcoming',kUp,(planM.length+pendR.length)+' item'+(planM.length+pendR.length===1?'':'s')+' still to pay','var(--mute)')}${kpi('Total savings',kSav,'after upcoming','var(--ok)',1)}</div>`;
  const pill=(k,v,t,cur)=>`<button class="chip${cur===v?' on':''}" data-${k}="${v}">${t}</button>`;
  return `<div class="mp"><button class="chip" data-mp="-1" aria-label="Previous month">‹</button><input type="month" id="dmp" value="${dm()}"><button class="chip" data-mp="1" aria-label="Next month">›</button>${dm()!==mo()?'<button class="chip" data-mp="0">This month</button>':''}</div>
${kpis}
<div class="chips" style="margin-bottom:8px">${pill('dk','cat','Category',S.dash)}${pill('dk','src','Fund source',S.dash)}${pill('dk','user','Person',S.dash)}</div>
<div class="chips" style="margin-bottom:12px">${pill('dw','all','Everyone',S.scope)}${pill('dw','mine','Mine',S.scope)}</div>
<div class="grid"><div class="sec"><h2>Distribution</h2><div class="card" style="text-align:center">${tot?donut(items,tot):'<div class="mute" style="padding:30px 0">No spending yet this month</div>'}
<div style="text-align:left">${items.map((x,i)=>`<div class="row"><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${COL[i%COL.length]};margin-right:8px"></i>${esc(x[0])}</span><span class="r">${aed(x[1])} <small style="display:inline;font-weight:400">${Math.round(x[1]/tot*100)}%</small></span></div>`).join('')}</div></div></div>
<div class="sec"><h2>Budget vs actual by category</h2><div class="card">${c1}${leg([['var(--mute)','Budget'],['var(--acc)','Spent'],['var(--bad)','Over budget']])}${brow?'<div style="margin-top:8px">'+brow+'</div>':'<div class="mute" style="margin-top:8px">Set category budgets in Settings.</div>'}</div></div>
<div class="sec"><h2>Spending by person, last 6 months</h2><div class="card">${c2}</div></div>
<div class="sec"><h2>Fund sources used</h2><div class="card">${c3}</div></div></div>`},
add(){return `<div class="card"><span class="cur">AED</span><input class="amt" id="amt" inputmode="decimal" placeholder="0" autocomplete="off">
<label>What for</label><input id="item" placeholder="e.g. Carrefour">
<label>Paid from</label>${chips(S.srcs,S.src,'src')}
<label>Category</label>${chips(S.cats,S.cat,'cat')}
<label><input type="checkbox" id="plan" style="width:auto;margin-right:8px">Upcoming (not paid yet)</label>
<input type="date" id="date" value="${today()}" style="display:none">
<button class="go" id="save">Save</button></div>`},
month(){
  const m=mo(),all=S.exp.filter(e=>e.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date));
  const paid=all.filter(e=>!e.planned),plan=all.filter(e=>e.planned);
  const d=+today().slice(8);
  const pendRec=S.rec.filter(r=>r.day>d&&!S.exp.some(e=>e.id==='r-'+r.id+'-'+m));
  const spent=sum(paid),upcoming=sum(plan)+sum(pendRec),fc=spent+upcoming,B=S.budget;
  const p=B?spent/B:0,col=p>1?'var(--bad)':p>=.8?'var(--warn)':'var(--ok)';
  const by=k=>{const o={};paid.forEach(e=>o[e[k]]=(o[e[k]]||0)+e.amount);return Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="row"><span>${esc(n)}</span><span class="r">${aed(v)}</span></div>`).join('')||'<div class="mute">Nothing yet</div>'};
  return `<div class="card"><div class="big">${aed(spent)}</div>
<div class="bar"><i style="width:${Math.min(p*100,100)}%;background:${col}"></i></div>
<div class="mute">${B?(p>1?`Over budget by ${aed(spent-B)}`:`${aed(B-spent)} left of ${aed(B)}`):'Set a monthly budget in Settings'}</div>
<div class="row"><span class="mute">Upcoming this month</span><span class="r">${aed(upcoming)}</span></div>
<div class="row"><span>Forecast</span><span class="r" style="color:${B&&fc>B?'var(--bad)':'inherit'}">${aed(fc)}</span></div></div>
<h2>By person</h2><div class="card">${by('user')}</div><h2>By category</h2><div class="card">${by('cat')}</div><h2>By fund source</h2><div class="card">${by('src')}</div>
<h2>Entries</h2><div class="card">${all.map(e=>`<div class="row"><div>${esc(e.item||e.cat)}${e.planned?'<span class="tag">upcoming</span>':''}<small>${e.date.slice(5)} · ${esc(e.user)} · ${esc(e.src)} · ${esc(e.cat)}</small></div><div class="r">${aed(e.amount)}<br>${e.planned?`<button class="sm" data-paid="${e.id}">Mark paid</button>`:''}<button class="sm" data-del="${e.id}">Delete</button></div></div>`).join('')||'<div class="mute">No entries yet. Tap Add.</div>'}</div>`},
rec(){return `<div class="card">${S.rec.map(r=>`<div class="row"><div>${esc(r.name)}<small>Day ${r.day} · ${esc(r.src)} · ${esc(r.cat)}</small></div><div class="r">${aed(r.amount)}<br><button class="sm" data-rdel="${r.id}">Remove</button></div></div>`).join('')||'<div class="mute">None yet. Add rent, school fee, tithes, subscriptions.</div>'}
<div class="row"><b>Total per month</b><span class="r">${aed(sum(S.rec))}</span></div></div>
<h2>Add fixed item</h2><div class="card"><input id="rn" placeholder="Name (e.g. Rent)">
<div class="two"><div><label>Amount (AED)</label><input id="ra" inputmode="decimal"></div><div><label>Day of month</label><input id="rd" inputmode="numeric" value="1"></div></div>
<label>Paid from</label><select id="rs">${S.srcs.map(x=>`<option>${esc(x)}</option>`).join('')}</select>
<label>Category</label><select id="rc">${S.cats.map(x=>`<option>${esc(x)}</option>`).join('')}</select>
<button class="go" id="radd">Add</button></div>
<p class="mute">Each item posts itself as an expense on its day every month, and counts in the forecast until then.</p>`},
set(){return `<div class="card"><label>Family members (comma separated)</label><input id="sm" value="${esc(members().join(', '))}">
<label>Monthly budget (AED)</label><input id="sb" inputmode="decimal" value="${S.budget||''}">
<label>Cash on hand (AED)</label><input id="sh" inputmode="decimal" value="${S.cash||''}">
<div class="mute" style="font-size:12px;margin-top:4px">Money available to spend. Balance = cash on hand minus spent. Savings = balance minus upcoming.</div>
<label>Budget per category (AED / month)</label>${S.cats.map(c=>`<div class="row"><span>${esc(c)}</span><input data-cb="${esc(c)}" inputmode="decimal" value="${S.cb[c]||''}" style="width:110px;text-align:right"></div>`).join('')}
<label>Fund sources (comma separated)</label><input id="ss" value="${esc(S.srcs.join(', '))}">
<label>Categories (comma separated)</label><input id="sc" value="${esc(S.cats.join(', '))}">
<label>Home chart groups spending by</label><select id="sd">${[['cat','Category'],['src','Fund source'],['user','Person']].map(o=>`<option value="${o[0]}"${S.dash===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>
<label>Google Sheets web app URL</label><input id="su" value="${esc(S.url)}" placeholder="https://script.google.com/macros/s/.../exec">
<button class="go" id="ssave">Save settings</button><button class="go" id="ssync" style="background:var(--card);color:var(--acc);border:1px solid var(--acc)">Sync now</button>
<button class="go" id="stest" style="background:var(--card);color:var(--acc);border:1px solid var(--acc)">Test sheet connection</button>
<button class="go" id="sall" style="background:var(--card);color:var(--acc);border:1px solid var(--acc)">Resend all entries to sheet</button>
<button class="go" id="sinv" style="background:var(--card);color:var(--acc);border:1px solid var(--acc)">Invite family (share link)</button>
<p class="mute">${S.err?`<span style="color:var(--bad)">${esc(S.err)}</span>`:S.url?(S.q.length?S.q.length+' change(s) waiting to sync':'All synced'):'Not connected to a sheet yet. Data is stored on this phone only.'}</p></div>`}
};

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button,input');if(!t)return;
  if(t.dataset.t){S.tab=t.dataset.t;save();render();if(['month','dash','tx'].includes(S.tab))sync();return}
  if(t.id==='who'){S.tab='who';render();return}
  if(t.dataset.who){choose(t.dataset.who);return}
  if(t.id==='wadd'){const n=$('#wn').value.trim();if(n)choose(n);return}
  if(t.id==='sinv'){
    if(!S.url){toast('Add the sheet URL first');return}
    const link=location.href.split('#')[0]+'#u='+encodeURIComponent(S.url);
    if(navigator.share)navigator.share({title:'Family spend tracker',url:link}).catch(()=>{});
    else if(navigator.clipboard)navigator.clipboard.writeText(link).then(()=>toast('Link copied'));
    else prompt('Copy this link',link);
    return}
  if(t.dataset.mp){DM=t.dataset.mp==='0'?null:shift(dm(),+t.dataset.mp);render();return}
  if(t.dataset.reset){Object.assign(F,{q:'',f:'',t:'',u:'all',c:'all',s:'all'});render();return}
  if(t.dataset.dk){S.dash=t.dataset.dk;save();render();return}
  if(t.dataset.dw){S.scope=t.dataset.dw;save();render();return}
  if(t.dataset.k){S[t.dataset.k]=t.dataset.v;save();const a=$('#amt').value,i=$('#item').value,p=$('#plan').checked,d=$('#date').value;render();$('#amt').value=a;$('#item').value=i;$('#plan').checked=p;$('#date').value=d;$('#date').style.display=p?'block':'none';return}
  if(t.id==='save'){
    const amount=parseFloat($('#amt').value);
    if(!S.user){S.tab='who';render();return}
    if(!(amount>0)){toast('Enter an amount');return}
    if(!S.src||!S.cat){toast('Pick a fund source and category');return}
    const planned=$('#plan').checked,e={id:uid(),date:planned?$('#date').value:today(),user:S.user,item:$('#item').value.trim(),amount,src:S.src,cat:S.cat,planned};
    S.exp.push(e);queue({a:'add',e});toast('Saved');render();return}
  if(t.dataset.del){if(confirm('Delete this entry?')){S.exp=S.exp.filter(e=>e.id!==t.dataset.del);queue({a:'del',id:t.dataset.del});render()}return}
  if(t.dataset.paid){const e=S.exp.find(e=>e.id===t.dataset.paid);e.planned=false;e.date=today();queue({a:'add',e});render();return}
  if(t.dataset.rdel){S.rec=S.rec.filter(r=>r.id!==t.dataset.rdel);queue({a:'cfg',cfg:cfg()});render();return}
  if(t.id==='radd'){
    const name=$('#rn').value.trim(),amount=parseFloat($('#ra').value),day=Math.min(28,Math.max(1,parseInt($('#rd').value)||1));
    if(!name||!(amount>0)){toast('Add a name and amount');return}
    S.rec.push({id:uid(),name,amount,day,src:$('#rs').value,cat:$('#rc').value});
    queue({a:'cfg',cfg:cfg()});autopost();render();toast('Added');return}
  if(t.id==='ssave'){
    const cb={};document.querySelectorAll('[data-cb]').forEach(i=>{const v=parseFloat(i.value);if(v>0)cb[i.dataset.cb]=v});
    const list=v=>v.split(',').map(x=>x.trim()).filter(Boolean);
    const f={users:list($('#sm').value),budget:parseFloat($('#sb').value)||0,srcs:list($('#ss').value),cats:list($('#sc').value),url:$('#su').value.trim(),dash:$('#sd').value,cash:parseFloat($('#sh').value)||0};
    if(f.url!==S.url){S.url=f.url;S.loaded=false;await pull()}
    Object.assign(S,{users:f.users,budget:f.budget,srcs:f.srcs,cats:f.cats,dash:f.dash,cash:f.cash,cb});
    queue({a:'cfg',cfg:cfg()});render();toast('Saved');return}
  if(t.id==='ssync'){toast('Syncing…');await sync();toast(S.err?'Sync failed, see message':'Synced');return}
  if(t.id==='stest'){
    if(!S.url){alert('Paste the sheet URL first');return}
    try{const x=await (await fetch(S.url)).text();let j;try{j=JSON.parse(x)}catch(e){throw new Error(x.includes('<')?webpage:'Unreadable reply')}
      if(j.error)throw new Error(j.error);S.err='';alert('Connected. The sheet has '+j.exp.length+' entries. This phone has '+S.exp.length+', with '+S.q.length+' waiting to send.')}
    catch(e){S.err='Test failed: '+(e.message||e);alert(S.err)}
    save();render();return}
  if(t.id==='sall'){
    if(!S.url){alert('Paste the sheet URL first');return}
    S.q=S.exp.map(e=>({a:'add',e}));S.q.push({a:'cfg',cfg:cfg()});save();toast('Sending…');await flush();render();toast(S.err?'Failed, see message':'All entries sent');return}
});
document.addEventListener('change',ev=>{if(ev.target.id==='plan')$('#date').style.display=ev.target.checked?'block':'none'});
document.addEventListener('input',e=>{if(e.target.id==='fq'){F.q=e.target.value;$('#txl').innerHTML=txList()}});
document.addEventListener('change',e=>{const k={ff:'f',ft:'t',fu:'u',fc:'c',fs:'s'}[e.target.id];if(k){F[k]=e.target.value;$('#txl').innerHTML=txList()}if(e.target.id==='dmp'){DM=e.target.value||null;render()}});
window.addEventListener('online',sync);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
setInterval(()=>{if(!document.hidden&&S.url)sync(true)},10000);
const hm=location.hash.match(/u=([^&]+)/);
if(hm){const u=decodeURIComponent(hm[1]);if(u&&u!==S.url){S.url=u;S.loaded=false;save()}}
S.tab=S.user?'dash':'who';render();sync();
</script>
</body>
</html>
